name: Run end-to-end tests

permissions: read-all

# On demand only. These tests share one live Jira sandbox, so running them
# per pull request would let concurrent runs collide, and fork PRs cannot read
# the secrets they need.
on:
  workflow_dispatch:

concurrency:
  group: jira-e2e
  cancel-in-progress: false

jobs:
  run-e2e-tests:
    name: End-to-end tests against the Jira sandbox
    runs-on: ubuntu-latest
    # Two legs (standalone CLI, then the same suite via sdkck) at up to 2
    # minutes per test.
    timeout-minutes: 45
    # id-token lets the Infisical action exchange GitHub's OIDC token for the
    # sandbox credentials, so no Infisical secret is stored in the repo.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
          # Nothing here pushes, and the default would leave GITHUB_TOKEN in
          # the workspace git config for every later step to reuse.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      # The steps below are what `npm run test:e2e` does locally, split out so
      # the sweep still runs when a test fails.
      - name: Build the CLI
        run: npm run build

      # For the second leg: the same suite through the latest sdkck host CLI
      # with this build packed and installed as its @hesed/jira plugin —
      # covering the `prepack` artifacts (oclif.manifest.json, README) and
      # plugin dispatch under a host. The plugin is installed before any
      # `sdkck jira` call so sdkck's first-use auto-installer cannot fetch the
      # published release over this build. The throwaway sdkck home
      # (mktemp -d) keeps the install, config and caches out of the runner's
      # real sdkck setup; the test side finds it via E2E_SDKCK_HOME.
      - name: Install the latest sdkck and the packed plugin
        run: |
          npm install --no-save sdkck
          home="$(mktemp -d)"
          echo "E2E_SDKCK_HOME=$home" >> "$GITHUB_ENV"
          # A `file:` URL is required: sdkck resolves any bare path containing
          # a slash as a GitHub org/repo. Packing into the throwaway home
          # keeps the tarball out of the workspace.
          tgz="$(npm pack --pack-destination "$home" | tail -n 1)"
          SDKCK_CACHE_DIR="$home/cache" \
          SDKCK_CONFIG_DIR="$home/config" \
          SDKCK_DATA_DIR="$home/data" \
            ./node_modules/.bin/sdkck plugins install "file:$home/$tgz"

      # The Infisical action exports the sandbox credentials to $GITHUB_ENV, so
      # every later step sees them. It therefore runs only after everything
      # that doesn't talk to Jira — actions, `npm ci` and `npm install sdkck`
      # lifecycle scripts, the build and pack — so none of those ever has them
      # in its environment.
      - name: Fetch sandbox credentials from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: dev

      - name: Run end-to-end tests
        run: npm run e2e:mocha
        env:
          E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

      - name: Run end-to-end tests via sdkck
        run: npm run e2e:mocha
        env:
          E2E_HOST_CLI: sdkck
          E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          E2E_SDKCK_HOME: ${{ env.E2E_SDKCK_HOME }}

      # `always()`, so a killed mocha run (the job timeout above skips its
      # `after` hooks) still gets its fixtures reclaimed. E2E_RUN_ID is what
      # makes that possible: it pins this run's label so the sweep can delete
      # this run's fixtures, not just the ones older than an hour.
      - name: Sweep leftover fixtures
        if: always()
        run: npm run e2e:sweep
        env:
          E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
